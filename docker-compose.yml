services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: sportmonitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/sportmonitor
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
